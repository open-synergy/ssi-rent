scenarios:
  - name: "Customer Rent Stock - Rent type with stock fields"
    steps:
      - step: "Create customer rent type with stock fields"
        action: "create"
        model: "customer_rent_type"
        save_as: "rent_type_stock"
        values:
          name: "Test Customer Rent Type Stock"
          code: "TCRTS01"

      - step: "Assert rent type created"
        action: "assert"
        target: "rent_type_stock"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Test Customer Rent Type Stock"
          code:
            type: "value"
            expected: "TCRTS01"
          active:
            type: "value"
            expected: true

  - name: "Customer Rent Stock - Full workflow with stock integration"
    steps:
      - step: "Create customer rent type for stock order"
        action: "create"
        model: "customer_rent_type"
        save_as: "rent_type_so"
        values:
          name: "Test Stock Rent Type"
          code: "TSRT001"

      - step: "Create partner for stock order"
        action: "create"
        model: "res.partner"
        save_as: "partner_so"
        values:
          name: "Test Rent Stock Partner"
          is_company: true

      - step: "Create income account for stock order"
        action: "create"
        model: "account.account"
        save_as: "income_account_so"
        values:
          name: "Test Rent Stock Income Account"
          code: "TRSIA01"
          user_type_id: "REF: account.data_account_type_revenue"
          internal_type: "other"

      - step: "Create product template for stock order"
        action: "create"
        model: "product.template"
        save_as: "product_tmpl_so"
        values:
          name: "Test Rent Stock Product"
          type: "service"

      - step: "Get product variant for stock order"
        action: "search"
        model: "product.product"
        save_as: "product_so"
        domain:
          - ["product_tmpl_id", "=", "EVAL: registry['product_tmpl_so'].id"]
        limit: 1

      - step: "Create customer rent order with stock integration"
        action: "create"
        model: "customer_rent_order"
        save_as: "rent_order_so"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['rent_type_so'].id"
          partner_id: "EVAL: registry['partner_so'].id"
          contact_partner_id: "EVAL: registry['partner_so'].id"
          product_id: "EVAL: registry['product_so'].id"
          account_id: "EVAL: registry['income_account_so'].id"
          date: "2024-01-01"
          date_start: "2024-01-01"
          date_end: "2025-01-01"
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          period_type: "yearly"
          recurring_interval: 1
          price_unit: 2000.0

      - step: "Assert rent order created in draft"
        action: "assert"
        target: "rent_order_so"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm rent order stock"
        action: "call"
        target: "rent_order_so"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "rent_order_so"
        method: "invalidate_cache"

      - step: "Assert rent order stock in confirm state"
        action: "assert"
        target: "rent_order_so"
        asserts:
          state:
            type: "value"
            expected: "confirm"
